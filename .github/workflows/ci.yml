name: ase-fleur

on: [push, pull_request, workflow_dispatch, workflow_call]

jobs:

  linting:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.8]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -e .[pre-commit,testing]
    - name: Run pre-commit
      run: |
        pre-commit run --all-files || (git status --short; git diff ; exit 1)

  tests:

    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8","3.9","3.10","3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -e .[testing]
    - name: pytest
      run: |
        pytest
    - name: Upload to Codecov
      uses: codecov/codecov-action@v3

  calulator-test:
    name: Test Fleur Calculator
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10",]
        fleur-version: ["6.0", "8.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .[testing]

      - name: Setup Mamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            fleur=${{ matrix.fleur-version }}

      - name: Ensure that Fleur code is correctly installed
        run: |
          micromamba run -n test-env fleur_MPI -version
          micromamba run -n test-env inpgen -version

      - name: pytest
        run: |
          export ASE_CONFIG_FILE=${GITHUB_WORKSPACE}/test-files/ase_test_micromamba.conf
          echo $ASE_CONFIG_FILE
          pytest --calculator -vv

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
